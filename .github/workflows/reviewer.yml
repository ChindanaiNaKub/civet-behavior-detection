name: Reviewer compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Fedora test runtime
        run: dnf -y install git python3 python3-pytest
      - uses: actions/checkout@v6
      - name: Record platform
        run: cat /etc/fedora-release && python3 --version
      - name: Test reviewer, packet launcher and record isolation
        run: python3 -m pytest scripts/test_review.py scripts/test_review_launcher.py scripts/test_gold_review.py scripts/test_agreement.py -q -p no:cacheprovider
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install pytest==8.4.2
      - name: Test reviewer, packet launcher and record isolation
        run: python -m pytest scripts/test_review.py scripts/test_review_launcher.py scripts/test_gold_review.py scripts/test_agreement.py -q -p no:cacheprovider
